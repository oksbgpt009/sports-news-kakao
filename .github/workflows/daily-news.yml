name: daily-sports-news

on:
  schedule:
    - cron: "30 22 * * *"  # UTC 22:30 = KST 07:30 (GitHub 사정으로 수~수십 분 늦을 수 있음)
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      # 카카오가 새 refresh token을 내려준 경우(만료 1개월 이내) Secret 자동 갱신
      - name: Update refresh token
        if: always() && hashFiles('.new_refresh_token') != ''
        run: gh secret set KAKAO_REFRESH_TOKEN < .new_refresh_token
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

name: daily-sports-news

on:
  # 매일 06:30, 18:30(KST)에 cron-job.org 가 GitHub API 로 이 워크플로를 실행시킴.
  # (GitHub 자체 schedule 은 2~5시간씩 늦어서 사용 안 함. 같이 켜두면 중복 발송됨)
  # 06:30 실행 → 전일 18:00~당일 06:00 기사, 18:30 실행 → 당일 06:00~18:00 기사
  workflow_dispatch:
    inputs:
      days:
        description: "수집 기간(일). 비우면 실제와 같은 12시간. 테스트할 때만 넣으세요"
        default: ""

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # docs/ 기사 목록 페이지 커밋용
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          WINDOW_DAYS: ${{ inputs.days }}
      # 카톡 '전체 N건 보기' 페이지를 저장소 docs/ 에 올림 → GitHub Pages 가 1분 내 공개
      - name: Publish article list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          [ -d docs ] && git add -A docs
          git diff --cached --quiet || (git commit -m "기사 목록 추가" && git push)
      # 카카오가 새 refresh token을 내려준 경우(만료 1개월 이내) Secret 자동 갱신
      - name: Update refresh token
        if: always() && hashFiles('.new_refresh_token') != ''
        run: gh secret set KAKAO_REFRESH_TOKEN < .new_refresh_token
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

name: daily-sports-news

on:
  schedule:
    # 하루 두 번 (GitHub 사정으로 수~수십 분 늦을 수 있음)
    - cron: "30 21 * * *"  # UTC 21:30 = KST 06:30 → 전일 18:00~당일 06:00 기사
    - cron: "30 9 * * *"   # UTC 09:30 = KST 18:30 → 당일 06:00~18:00 기사
  workflow_dispatch:
    inputs:
      days:
        description: "수집 기간(일). 비우면 실제와 같은 12시간. 테스트할 때만 넣으세요"
        default: ""

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          WINDOW_DAYS: ${{ inputs.days }}
      # 카카오가 새 refresh token을 내려준 경우(만료 1개월 이내) Secret 자동 갱신
      - name: Update refresh token
        if: always() && hashFiles('.new_refresh_token') != ''
        run: gh secret set KAKAO_REFRESH_TOKEN < .new_refresh_token
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
